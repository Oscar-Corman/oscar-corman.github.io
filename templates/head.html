<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>$title$</title>
    <meta name="description" content="$description$">
    <link rel="canonical" href="$site_url$$canonical_path$">
    $if(alternate_lang)$
    <link rel="alternate" hreflang="$lang$" href="$site_url$$canonical_path$">
    <link rel="alternate" hreflang="$alternate_lang$" href="$site_url$$alternate_path$">
    <link rel="alternate" hreflang="x-default" href="$site_url$$x_default_path$">
    $endif$
    $if(noindex)$
    <meta name="robots" content="noindex">
    $endif$

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="$site_name$">
    <meta property="og:title" content="$title$">
    <meta property="og:description" content="$description$">
    <meta property="og:url" content="$site_url$$canonical_path$">
    <meta property="og:locale" content="$og_locale$">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Apply the stored theme before first paint so dark-mode users get no white flash. -->
    <script>
    (function () {
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        var dark = stored === "dark" || (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark-mode");
    })();
    </script>

    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    <link rel="stylesheet" href="/static/css/general.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="stylesheet" href="/static/css/syntax.css">

</head>
